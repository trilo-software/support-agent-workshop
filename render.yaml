projects:
- name: esteban2904-rag-agent-workshop
  environments:
  - name: production
    services:
    - type: web
      name: esteban2904-support-agent
      runtime: python
      region: oregon
      plan: free
      buildCommand: pip install uv && uv sync --frozen --no-dev
      startCommand: uv run python -m support_agent.server
      healthCheckPath: /healthz
      autoDeploy: true
      envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - fromGroup: gemini-workshop
