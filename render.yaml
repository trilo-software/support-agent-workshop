projects:
- name: rag-agent-workshop
  environments:
  - name: production
    databases:
    - name: support-agent-db
      plan: basic-256mb
      region: oregon
      postgresMajorVersion: '18'
    services:
    - type: web
      name: support-agent
      runtime: python
      region: oregon
      plan: starter
      buildCommand: pip install uv && uv sync --frozen --no-dev
      startCommand: uv run python -m support_agent.server
      healthCheckPath: /healthz
      autoDeploy: true
      envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-agent-db
          property: connectionString
      - key: PYTHON_VERSION
        value: '3.12'
      - key: GEMINI_API_KEY
        sync: false
