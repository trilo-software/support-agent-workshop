<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Pura Vida — Soporte</title>
<style>
  :root {
    --cafe: #4b2e1e;
    --crema: #f6efe7;
    --verde: #2e7d5b;
    --gris: #8a7f76;
    --burbuja-user: #4b2e1e;
    --burbuja-bot: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--crema);
    color: var(--cafe);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: var(--cafe);
    color: var(--crema);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { font-size: 12px; margin: 0; opacity: .75; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 82%;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--burbuja-user);
    color: var(--crema);
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: var(--burbuja-bot);
    border: 1px solid #e4dbd0;
    border-bottom-left-radius: 4px;
  }
  .meta { max-width: 82%; margin: -8px 0 16px 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    background: #eaf4ef;
    color: var(--verde);
    border: 1px solid #cbe5d8;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .chip.tool {
    background: #f2ecfb;
    color: #5b3fa8;
    border-color: #ddd0f2;
  }
  .msg.typing { color: var(--gris); font-style: italic; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px 18px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d8cec2;
    border-radius: 10px;
    background: #fff;
    color: var(--cafe);
  }
  input:focus { outline: 2px solid var(--cafe); border-color: transparent; }
  button {
    padding: 12px 20px;
    font-size: 15px;
    border: 0;
    border-radius: 10px;
    background: var(--cafe);
    color: var(--crema);
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: #b3372f; }
</style>
</head>
<body>
<header>
  <span class="logo">☕</span>
  <div>
    <h1>Café Pura Vida — Soporte</h1>
    <p>Agente con RAG · pregunta por envíos, planes, pagos, pedidos…</p>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Escribe tu pregunta… p. ej. ¿cuánto tarda el envío a Limón?" />
  <button id="send" type="submit">Enviar</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  // El historial vive en el navegador y viaja completo en cada request:
  // el servidor no guarda estado de sesión.
  const history = [];

  function addMessage(role, text, extraClass) {
    const div = document.createElement("div");
    div.className = "msg " + role + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addMeta(sources, toolCalls) {
    if ((!sources || !sources.length) && (!toolCalls || !toolCalls.length)) return;
    const meta = document.createElement("div");
    meta.className = "meta";
    (sources || []).forEach(s => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = "📚 " + s.title + " · " + s.score.toFixed(2);
      chip.title = s.source;
      meta.appendChild(chip);
    });
    (toolCalls || []).forEach(name => {
      const chip = document.createElement("span");
      chip.className = "chip tool";
      chip.textContent = "🔧 " + name;
      meta.appendChild(chip);
    });
    chat.appendChild(meta);
    chat.scrollTop = chat.scrollHeight;
  }

  addMessage("bot", "¡Pura vida! 👋 Soy el asistente de Café Pura Vida. ¿En qué te ayudo?");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    send.disabled = true;
    const typing = addMessage("bot", "escribiendo…", "typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) {
        addMessage("bot", data.error || "Algo salió mal. Intenta de nuevo.", "error");
      } else {
        addMessage("bot", data.reply);
        addMeta(data.sources, data.tool_calls);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      typing.remove();
      addMessage("bot", "No pude conectar con el servidor: " + err.message, "error");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
